name: CI and CD Pipeline

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

  deliver:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create delivery package
        run: |
          zip -r deliverable.zip src app.py tests requirements.txt
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app-deliverable
          path: deliverable.zip
